# Build check.
#
# GitHub Pages builds and deploys this site by itself on every push to master;
# this workflow does not deploy anything. It exists because a green Pages build
# is a weak guarantee: Liquid resolves a mistyped publication id, or a link to a
# page that no longer exists, to an empty string and carries on, so the site
# builds happily and ships the mistake. This rebuilds the site the same way
# Pages does and then checks it (see tools/check_site.py).
#
# A red cross here means the push that caused it went live anyway, since Pages
# deploys independently. Treat it as "go and look", not as a gate.

name: Build check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true # bundle install + cache the gems

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install pyyaml

      # PAGES_ENV / PAGES_REPO_NWO are what GitHub Pages sets for its own build.
      # Without them the github-pages gem either cannot find the repo or invents
      # an enterprise-style "/pages/<owner>" baseurl, and every link check then
      # fails for the wrong reason.
      - name: Build the site as GitHub Pages does
        env:
          JEKYLL_ENV: production
          PAGES_ENV: dotcom
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: bundle exec jekyll build --trace

      - name: Check the built site
        run: python3 tools/check_site.py --site _site
