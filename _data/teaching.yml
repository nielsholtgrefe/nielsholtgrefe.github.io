# Teaching & academic service, rendered on /teaching/.
#
# To add an entry, append an item under the relevant section. Fields:
#   role         (required)  e.g. "Teaching assistant", "Guest lecture", "Reviewer"
#   title        (required)  course name, talk title, or activity
#   years        (required)  list of years/instances — each is rendered on its own
#                            line (newest first), so a course taught several times
#                            "looks fuller"
#   institution  (optional)  where it took place
#   note         (optional)  short extra detail (level, audience, co-supervisor, ...)
#   student      (optional)  supervised student name (also shown on the CV)
#   url          (optional)  link to course page / material / venue
#
# Sections are rendered in the order listed here; each has a `heading` and `items`.
# Items within a section are ordered newest-first.

