# Running list of corrections, rendered on /corrections/ (a URL-only page,
# linked from the bottom of the publications page — not in the main nav).
#
# To add one, append an entry that targets a paper by its `paper:` id (must match
# an `id:` in _data/pubs.yml); the page then links to that paper and shows its
# number from the publications page automatically. Add correction lines under
# `items:`.
#   date (optional)  when the correction was noted
#   text (required)  the correction itself. Rendered as raw HTML, so inline tags
#                    such as <i> and <b> work; LaTeX in \( ... \) is typeset by
#                    MathJax, which the page loads.

- paper: squirrel
  items:
    - date: 2026-08-20
      text: >-
        Materials and Methods, \(\delta\)-heuristic, Steps I–III: the interpretation of the
        \(\delta\)-value is reversed in the text. A tree-like quartet has \(\delta\) close to
        0, so it should read as follows. In Step I, if \(\delta_{\{a,b,c,d\}}\) is
        <b>close to 0</b>, we expect the split \(ad|bc\) (the text says "close to 1" and
        "\(ab|cd\)"). In Step II, \(S_\lambda\) contains the 4-taxa subsets whose
        \(\delta\)-value is <b>at most</b> \(\lambda\), and \(F_\lambda\) those whose
        \(\delta\)-value is <b>larger</b> than \(\lambda\) (the text says "at least" and
        "smaller"). In Step III, a 4-taxa set in \(S_\lambda\) is assigned the split
        \(s \in \{ab|cd,\, ac|bd,\, ad|bc\}\) for which \(h_s\) is <b>smallest</b> (the text
        says "the highest").
    - date: 2026-10-25
      text: >-
        Supplementary Material, proof of Lemma A.3: the words "opposite" and "neighbours"
        are swapped. For \(i = 1\), \(y_i\) and \(y_j\) are <b>neighbours</b> in
        \(\binom{s_{1j}}{2} + \binom{t_j}{2}\) of the 4-cycles and <b>opposite</b> in
        \(s_{1j} \cdot t_j\) of them; for \(i \geq 2\), they are <b>neighbours</b> in
        \(r_i + t_j\) of the 4-cycles and <b>opposite</b> in \(s_{ij}\) of them. The
        displayed formulas are correct.
    - date: 2026-10-25
      text: >-
        Supplementary Material, proof of Lemma A.5, Case 1, first condition: the expression
        simplifies to \((k-j)\cdot(2n - k - j + 1)\), with a <b>minus</b> sign before
        \(k\); the text says "\((k-j)\cdot(2n + k - j + 1)\)". The inequality still holds,
        since \(k + j \leq 2n - 3\).