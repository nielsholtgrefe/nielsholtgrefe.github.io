# Conferences, workshops and seminars, rendered as a vertical timeline on
# /conferences/.
#
# To add an event, append an item (keep newest first). Fields:
#   name          (required)  event name
#   url           (optional)  event link
#   location      (required)  city / "online participant" / etc.
#   date          (required)  human-readable month + year
#   group         (required)  timeline bucket: "Upcoming" or a year like "2025"
#   country       (optional)  ISO 3166-1 alpha-2 code for the flag outline
#                             (an "online"/"Online" location shows a globe instead)
#   contributions (optional)  list of { type, title } you presented there
#
# Items are grouped by `group` in the order they first appear below, so keep
# entries sorted newest-first.

