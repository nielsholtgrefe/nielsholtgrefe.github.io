# Software packages rendered on /software/.
#
# To add a package, append an entry. Fields:
#   name        (required)  package name (shown as inline code)
#   language    (optional)  e.g. "Python", "Julia"
#   image       (optional)  background motif behind the card header
#   tagline     (required)  one-line summary
#   description (required)  2-3 sentence description
#   github      (optional)  code repository URL
#   docs        (optional)  documentation website URL
#   pubs        (optional)  list of related publication titles (must match a title in
#                           _data/pubs.yml); rendered as links to /publications/

- name: phylozoo
  language: Python
  image: /assets/images/phylozoo_logo.svg
  tagline: "The shared foundation for working with phylogenetic networks in Python."
  description: >-
    PhyloZoo is a Python package for working with phylogenetic networks and the kinds of
    evolutionary data that come with them. It is the common foundation that Squirrel and
    PaNDA are built on: it handles both directed and semi-directed networks, reads and
    writes all the usual phylogenetic file formats, draws publication-ready figures, and
    is fast enough for large datasets.
  github: "https://github.com/nholtgrefe/phylozoo"
  docs: "https://nholtgrefe.github.io/phylozoo/"
  pubs:
    - "PhyloZoo: a unified framework for phylogenetic network analysis in Python"

- name: physquirrel
  language: Python
  image: /assets/images/squirrel_cover4.svg
  # the header is a short band; frame it on the squirrel itself
  image_position: "center 30%"
  tagline: "Build a phylogenetic network straight from a DNA alignment."
  description: >-
    physquirrel implements the Squirrel algorithm, which reconstructs a phylogenetic
    network either from a DNA sequence alignment or from a set of four-species building
    blocks. It comes with a graphical interface for anyone who would rather not write
    code, and a full Python API for those who would. It runs in minutes on a normal
    laptop.
  github: "https://github.com/nholtgrefe/squirrel"
  docs: "https://nholtgrefe.github.io/squirrel/"
  pubs:
    - "Squirrel: Reconstructing Semi-directed Phylogenetic Level-1 Networks from Four-Leaved Networks or Sequence Alignments"

- name: phypanda
  language: Python
  image: /assets/images/phypanda_icon.svg
  tagline: "Which species preserve the most evolutionary diversity?"
  description: >-
    phypanda (PaNDA) helps answer a conservation question: if you can only protect a
    limited number of species, which ones together preserve the most evolutionary
    variety? It measures that variety on phylogenetic networks, finds the best selection
    for you, and shows the result through an interactive interface.
  github: "https://github.com/nholtgrefe/panda"
  docs: "https://nholtgrefe.github.io/panda/"
  pubs:
    - "PaNDA: Efficient Optimization of Phylogenetic Diversity in Networks"
    - "Tractable Maximization of Budgeted Phylogenetic Diversity on Networks Utilizing Node Scanwidth"

- name: scanwidth
  language: Python
  image: /assets/images/scanwidth.png
  # frame on a lower, denser part of the figure (the reticulation + cut arcs)
  image_position: "center 72%"
  tagline: "Measure how tree-like a network is."
  description: >-
    Many hard computations on a phylogenetic network become much easier when the network
    is close to being a tree. <em>Scanwidth</em> puts a number on how close it is, and
    this package computes it: exactly when you can afford to, and with a fast, near-optimal
    heuristic when you cannot. It is also useful for preparing networks before running
    other tools.
  github: "https://github.com/nholtgrefe/scanwidth"
  docs: "https://nholtgrefe.github.io/scanwidth/"
  pubs:
    - "Exact and Heuristic Computation of the Scanwidth of Directed Acyclic Graphs"
    - "Computing the Scanwidth of Directed Acyclic Graphs"
