# Research themes rendered on /research/.
#
# `pubs:` lists the publication ids (see `id:` in _data/pubs.yml) shown in this
# theme's panel, IN DISPLAY ORDER: the first three are shown in full under
# "Selected publications", any after that appear as [n] links under "Other
# related publications". Reorder the list to change what is featured.

- id: reconstruction
  title: "Reconstructing Evolutionary Networks"
  tags: [Algorithms, Combinatorics, Software]
  pubs:
    - squirrel
    - sequence-bounds
    - few-quarnets
    - algebraic-invariants
  body: >-
    The central computational problem in phylogenetics is <em>reconstruction</em>:
    given genetic sequence data from a set of species, find the network that best
    explains their shared history. My approach works through <em>quarnets</em>, the
    four-leaf subnetworks that describe how each group of four species is related, and
    then assembles the large network from these small pieces, much like a jigsaw
    puzzle. The algorithms I design are provably <em>consistent</em>, meaning they
    recover the true network given enough data, and <em>efficient</em>, using an
    asymptotically optimal number of quarnets in polynomial time. I also study how much
    sequence data is actually needed to get the right answer with high probability.

- id: identifiability
  title: "Identifiability and Statistical Foundations"
  tags: [Algebra, Probability, Combinatorics]
  pubs:
    - identifiability-level2
    - algebraic-invariants
    - distinguishing-level2
    - invariants-level1
  body: >-
    Before building an inference method, there is a more basic question to settle: can
    two different networks even be told apart from DNA data at all? That property is
    called <em>identifiability</em>. Where it fails, no method can recover the true
    network, however much data you collect. I study identifiability under the standard
    Markov models of DNA evolution, such as Jukes–Cantor, CFN and random-walk models,
    using tools from algebraic geometry, combinatorics and probability. One of these
    tools is <em>phylogenetic invariants</em>: polynomial relations that hold for every
    network in a class, and that can be used to tell competing histories apart. The
    results mark out what is recoverable from biological data in the first place.

- id: diversity
  title: "Phylogenetic Diversity and Conservation"
  tags: [Optimization, Conservation Biology, Software]
  pubs:
    - budgeted-pd
    - kernelization-pd
    - panda
  body: >-
    <em>Phylogenetic diversity</em> (PD) measures how evolutionarily distinct a set of
    species is. For conservation, a group spanning many deep branches of the tree of
    life is worth more than a cluster of close relatives. So with a limited budget,
    which species should we protect to keep as much diversity as possible? On a tree
    there is a simple greedy answer. On a phylogenetic network, which is the more
    realistic picture when hybridization has occurred, the problem becomes NP-hard. I
    develop algorithms that make it tractable again by exploiting structural parameters
    such as scanwidth, and study harder versions where protecting a species also means
    protecting the prey it depends on.

- id: parameters
  title: "Structural Parameters and Algorithms"
  tags: [Parameterized Complexity, Graph Theory, Algorithms]
  pubs:
    - scanwidth-exact
    - budgeted-pd
    - panda
    - scanwidth-thesis
    - kernelization-pd
  body: >-
    Many hard problems on phylogenetic networks become tractable once the network is
    close enough to a tree, and <em>scanwidth</em> is one way to make "close enough"
    precise. It measures the tree-likeness of a directed acyclic graph by capturing how
    much branching and merging happens at once as you sweep through it. I design
    <em>parameterized algorithms</em> that exploit this: sweeping through a network while
    tracking only the lineages active at any one moment turns problems that are hopeless
    in general into practical dynamic programs whenever scanwidth is small. Relying on a
    parameter also means being able to compute it, so I developed the
    first exact algorithm for the scanwidth of general DAGs, along with heuristics that
    come close to optimal on real biological datasets.
