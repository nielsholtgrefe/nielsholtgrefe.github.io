<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <rect width="120" height="90" fill="#ecf7f0" rx="4"/>
  <!-- Root -->
  <circle cx="60" cy="10" r="4.5" fill="#1a5c46"/>
  <!-- Main split -->
  <line x1="60" y1="14.5" x2="33" y2="35" stroke="#1a5c46" stroke-width="2"/>
  <line x1="60" y1="14.5" x2="87" y2="29" stroke="#1a5c46" stroke-width="2"/>
  <!-- Left internal -->
  <circle cx="33" cy="35" r="4" fill="#1a5c46"/>
  <line x1="33" y1="39" x2="20" y2="58" stroke="#1a5c46" stroke-width="1.8"/>
  <line x1="33" y1="39" x2="46" y2="58" stroke="#1a5c46" stroke-width="1.8"/>
  <!-- Right internal (longer branch = more diversity) -->
  <circle cx="87" cy="29" r="4" fill="#1a5c46"/>
  <line x1="87" y1="33" x2="70" y2="54" stroke="#1a5c46" stroke-width="1.8"/>
  <line x1="87" y1="33" x2="102" y2="46" stroke="#1a5c46" stroke-width="1.8"/>
  <!-- Deeper right subtree -->
  <circle cx="102" cy="46" r="3.5" fill="#1a5c46"/>
  <line x1="102" y1="49.5" x2="92" y2="70" stroke="#1a5c46" stroke-width="1.5"/>
  <line x1="102" y1="49.5" x2="111" y2="70" stroke="#1a5c46" stroke-width="1.5"/>
  <!-- Leaves: green = selected for conservation, muted = not selected -->
  <circle cx="20" cy="58" r="4.5" fill="#28a96e"/>
  <circle cx="46" cy="58" r="4.5" fill="#a8c8b5"/>
  <circle cx="70" cy="54" r="4.5" fill="#28a96e"/>
  <circle cx="92" cy="70" r="4" fill="#28a96e"/>
  <circle cx="111" cy="70" r="4" fill="#a8c8b5"/>
  <!-- Highlight selected lineage branches -->
  <line x1="60" y1="14.5" x2="33" y2="35" stroke="#28a96e" stroke-width="1.2" opacity="0.55"/>
  <line x1="33" y1="39" x2="20" y2="58" stroke="#28a96e" stroke-width="1.2" opacity="0.55"/>
  <line x1="60" y1="14.5" x2="87" y2="29" stroke="#28a96e" stroke-width="1.2" opacity="0.55"/>
  <line x1="87" y1="33" x2="70" y2="54" stroke="#28a96e" stroke-width="1.2" opacity="0.55"/>
</svg>
