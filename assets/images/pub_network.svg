<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <rect width="120" height="90" fill="#e4f2f7" rx="4"/>
  <!-- Root -->
  <circle cx="60" cy="11" r="5" fill="#1a5c7a"/>
  <!-- Internal nodes -->
  <circle cx="27" cy="36" r="4.5" fill="#1a5c7a"/>
  <circle cx="93" cy="36" r="4.5" fill="#1a5c7a"/>
  <!-- Merge node (orange) -->
  <circle cx="60" cy="59" r="5" fill="#e07b20" stroke="white" stroke-width="1.5"/>
  <!-- Leaves -->
  <circle cx="12" cy="77" r="4" fill="#2a8566"/>
  <circle cx="40" cy="77" r="4" fill="#2a8566"/>
  <circle cx="78" cy="77" r="4" fill="#2a8566"/>
  <circle cx="106" cy="77" r="4" fill="#2a8566"/>
  <!-- Edges: root to internals -->
  <line x1="60" y1="16" x2="27" y2="31.5" stroke="#1a5c7a" stroke-width="2"/>
  <line x1="60" y1="16" x2="93" y2="31.5" stroke="#1a5c7a" stroke-width="2"/>
  <!-- Internals to merge node (left = solid edge, right = dashed edge) -->
  <line x1="27" y1="40.5" x2="60" y2="54" stroke="#1a5c7a" stroke-width="2"/>
  <line x1="93" y1="40.5" x2="60" y2="54" stroke="#e07b20" stroke-width="1.8" stroke-dasharray="4 2.5"/>
  <!-- Internals to outer leaves -->
  <line x1="27" y1="40.5" x2="12" y2="73" stroke="#1a5c7a" stroke-width="2"/>
  <line x1="93" y1="40.5" x2="106" y2="73" stroke="#1a5c7a" stroke-width="2"/>
  <!-- Merge node to leaves -->
  <line x1="60" y1="64" x2="40" y2="73" stroke="#1a5c7a" stroke-width="2"/>
  <line x1="60" y1="64" x2="78" y2="73" stroke="#1a5c7a" stroke-width="2"/>
  <!-- Arrow on merge edge -->
  <polygon points="60,54 55,47 65,47" fill="#e07b20" opacity="0.7"/>
</svg>
