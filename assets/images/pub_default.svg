<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <rect width="120" height="90" fill="#f4f3ee" rx="4"/>
  <!-- Coverage sets (overlapping ellipses) -->
  <ellipse cx="46" cy="42" rx="28" ry="22"
           fill="#4a6fa5" fill-opacity="0.14" stroke="#4a6fa5" stroke-width="1.6"/>
  <ellipse cx="76" cy="38" rx="24" ry="20"
           fill="#c04b4b" fill-opacity="0.12" stroke="#c04b4b" stroke-width="1.6"/>
  <ellipse cx="63" cy="62" rx="22" ry="17"
           fill="#2a8c6f" fill-opacity="0.12" stroke="#2a8c6f" stroke-width="1.6"/>
  <!-- Set labels -->
  <text x="30" y="33" font-family="serif" font-size="11" fill="#4a6fa5" font-style="italic">S₁</text>
  <text x="82" y="30" font-family="serif" font-size="11" fill="#c04b4b" font-style="italic">S₂</text>
  <text x="73" y="72" font-family="serif" font-size="11" fill="#2a8c6f" font-style="italic">S₃</text>
  <!-- Optimal selection points -->
  <circle cx="50" cy="42" r="3.5" fill="#4a6fa5" opacity="0.85"/>
  <circle cx="74" cy="35" r="3.5" fill="#c04b4b" opacity="0.85"/>
  <circle cx="63" cy="62" r="3.5" fill="#2a8c6f" opacity="0.85"/>
  <!-- Greedy path -->
  <path d="M 50 42 L 74 35 L 63 62" fill="none" stroke="#555"
        stroke-width="1.3" stroke-dasharray="3.5 2" opacity="0.55"/>
</svg>
