<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90">
  <rect width="120" height="90" fill="#f0f0f9" rx="4"/>
  <!-- Faint grid -->
  <line x1="20" y1="10" x2="20" y2="80" stroke="#ccc" stroke-width="0.6"/>
  <line x1="60" y1="10" x2="60" y2="80" stroke="#ccc" stroke-width="0.6"/>
  <line x1="100" y1="10" x2="100" y2="80" stroke="#ccc" stroke-width="0.6"/>
  <line x1="10" y1="26" x2="110" y2="26" stroke="#ccc" stroke-width="0.6"/>
  <line x1="10" y1="55" x2="110" y2="55" stroke="#ccc" stroke-width="0.6"/>
  <!-- Axes -->
  <line x1="15" y1="75" x2="110" y2="75" stroke="#999" stroke-width="1.3"/>
  <line x1="15" y1="78" x2="15" y2="12" stroke="#999" stroke-width="1.3"/>
  <polygon points="110,72 114,75 110,78" fill="#999"/>
  <polygon points="12,12 15,8 18,12" fill="#999"/>
  <!-- Curve 1 (polynomial, purple) -->
  <path d="M 18 65 C 30 15, 52 72, 72 24 S 102 64 112 34"
        fill="none" stroke="#5b4abf" stroke-width="2.3" stroke-linecap="round"/>
  <!-- Curve 2 (dashed, pink) -->
  <path d="M 18 52 C 38 80, 58 14, 82 50 T 112 42"
        fill="none" stroke="#c04b9a" stroke-width="1.8"
        stroke-dasharray="5 2.5" stroke-linecap="round"/>
  <!-- Intersection points (invariant roots) -->
  <circle cx="40" cy="48" r="4" fill="#e8a838" stroke="white" stroke-width="1.5"/>
  <circle cx="74" cy="26" r="4" fill="#e8a838" stroke="white" stroke-width="1.5"/>
</svg>
